faq:
  title: "Частые вопросы"
  1:
    q: "Что уже можно попробовать?"
    a: "Пока это прототип. CRM уже в работе, остальные модули в разработке. Мы ищем первые клиники для пилота."
  2:
    q: "Есть ли онлайн-запись для владельцев животных?"
    a: "Нет. Записи для владельцев пока нет: модуль записи на приём в разработке и на сайте не доступен."
  3:
    q: "Сколько стоит?"
    a: "Пилот: обсуждаем условия, тариф по запросу."
  4:
    q: "Что будет с заявкой?"
    a: "Заявка сохраняется у нас и отправляется на почту команды. Мы свяжемся с вами по указанным контактам."
  5:
    q: "Как попасть в пилот?"
    a: "Оставьте заявку на сайте. Мы свяжемся с вами и обсудим условия."

