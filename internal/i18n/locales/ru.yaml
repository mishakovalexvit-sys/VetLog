privacy:
  title: "Политика конфиденциальности"
  body: "1. Какие данные мы получаем. Через форму заявки мы получаем имя, телефон, название клиники и, если вы его укажете, email. Эти данные вы передаёте сами. При отправке заявки мы также сохраняем IP-адрес и User-Agent вашего браузера. 2. Зачем. Чтобы ответить на заявку, обсудить условия пилота и подтвердить ваше согласие на обработку данных. Для других целей данные не используем. 3. Где и как хранятся. Заявки и записи о согласии хранятся в базе данных и пересылаются на рабочую почту команды. 4. Ваши права. Вы можете попросить показать, исправить или удалить ваши данные, написав нам. 5. Контакты. Контакт для вопросов о персональных данных добавим до публикации сайта."
